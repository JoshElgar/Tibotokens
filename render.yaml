services:
  - type: web
    name: tibotokens
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/index.js
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: X_BEARER_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

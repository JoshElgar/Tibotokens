services:
  - type: web
    name: tibotokens
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/index.js
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: X_BEARER_TOKEN
        sync: false
      - key: X_USERNAME
        value: thsottiaux
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-5.6-sol
      - key: MANUAL_CHECK_TOKEN
        sync: false
      - key: POLL_INTERVAL_MS
        value: "300000"
